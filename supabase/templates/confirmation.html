<!--
  【このファイルの読み方】

  ■ 本番（Supabase Dashboard）
    Authentication → Email Templates → Confirm signup の「本文」には、
    下の <body> の中身だけをコピーして貼ってください。
    （<html>・<head>・<body> のタグは Dashboard には書かないでください。）

  ■ なぜ ConfirmationURL を使わないか
    {{ .ConfirmationURL }} は PKCE 用で、メールを開いたブラウザに
    「サインアップ時と同じ code verifier Cookie」が必要です。
    別端末・別ブラウザ・localhost と本番の混在では
    「PKCE code verifier not found in storage」になりやすいです。

  ■ このテンプレート
    アプリの /auth/callback へ token_hash を渡し、サーバーで verifyOtp します
    （src/app/auth/callback/route.ts）。PKCE verifier は不要です。

  ■ RedirectTo について
    signUp の emailRedirectTo（例: https://viewtrace.net/auth/callback）が入ります。
    クエリを自分で付けない限り `?token_hash=…` で問題ありません。
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Confirm your signup</title>
</head>
<body style="font-family: system-ui, sans-serif; line-height: 1.5;">
  <h2>Confirm your signup</h2>
  <p>Follow this link to confirm your user:</p>
  <p>
    <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=signup">Confirm your mail</a>
  </p>
</body>
</html>
